<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODIE - About Us</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: #0b0b0b;
            color: white;
            border: 2px solid #ff8c00;
            padding: 12px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-family: Georgia, serif;
        }

        .back-button:hover {
            background-color: #ff8c00;
            color: black;
        }

        .about-image {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .about-image img {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>

</head>

<body>

    <a href="idex.html" class="back-button">← Back to Home</a>

    <div class="about-image">

        <img src="FOODIE About Us Restaurant Showcase.png"
            alt="FOODIE About Us Restaurant Showcase">

    </div>

</body>

</html>
